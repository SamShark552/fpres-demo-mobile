name: FPRES Demo Browser QA
on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: fpres-browser-qa
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm init -y
      - run: npm install -D @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/fpres-http.log 2>&1 &
      - run: mkdir -p tests
      - run: cp qa/fpres.spec.js tests/fpres.spec.js
      - run: cp qa/regression.spec.js tests/regression.spec.js
      - run: npx playwright test tests/fpres.spec.js tests/regression.spec.js --workers=1
